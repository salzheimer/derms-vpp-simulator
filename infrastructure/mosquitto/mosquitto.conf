# Mosquitto configuration for LOCAL DEVELOPMENT ONLY.
# Anonymous, unencrypted access is not acceptable outside a dev machine: production requires authenticated,
# TLS-encrypted clients (Zero Trust, see .ai/rules/security.md).

persistence true
persistence_location /mosquitto/data/
log_dest stdout

# Standard MQTT
listener 1883 0.0.0.0
protocol mqtt

# MQTT over WebSockets (browser tools, future dashboard)
listener 9001 0.0.0.0
protocol websockets

allow_anonymous true
